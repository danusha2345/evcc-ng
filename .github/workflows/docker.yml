name: Docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build all platforms
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=docker-check
          cache-to: type=gha,scope=docker-check,mode=max

      - name: Load native image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: evcc-ng:check

      - name: Smoke
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail

          # shellcheck disable=SC2329
          cleanup() {
            status=$?
            docker logs evcc-ng-smoke || true
            docker inspect --format '{{json .State}}' evcc-ng-smoke || true
            docker rm -f evcc-ng-version evcc-ng-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          timeout 30s docker run --rm --name evcc-ng-version evcc-ng:check evcc --version
          docker run -d --name evcc-ng-smoke \
            -p 127.0.0.1:7070:7070 \
            evcc-ng:check evcc --disable-auth --database /tmp/evcc-smoke.db

          deadline=$((SECONDS + 180))
          while ((SECONDS < deadline)); do
            if [[ "$(docker inspect --format '{{.State.Running}}' evcc-ng-smoke)" != true ]]; then
              echo "Container exited before becoming ready" >&2
              exit 1
            fi

            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:7070/api/state \
                | jq --exit-status '.apiReady == true' >/dev/null \
              && [[ "$(curl --silent --show-error --max-time 5 --output /dev/null \
                --write-out '%{http_code}' http://127.0.0.1:7070/)" == 200 ]] \
              && [[ "$(docker inspect --format '{{.State.Health.Status}}' evcc-ng-smoke)" == healthy ]]; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become ready and healthy within 180 seconds" >&2
          exit 1
